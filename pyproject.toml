[project]
name = "invoice-analysis"
version = "0.1.0"
description = "Google ADK invoice-analyzer agent — 60-minute workshop kit"
requires-python = ">=3.10"
dependencies = [
    "google-adk~=2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
